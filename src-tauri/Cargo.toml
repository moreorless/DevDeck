[package]
name = "devdeck"
version = "0.1.0"
description = "DevDeck - 个人开发者桌面工具箱"
authors = ["byzer"]
edition = "2024"

[lib]
# The `_lib` suffix is necessary to make the lib name unique and not conflict with the bin name.
# See https://github.com/rust-lang/cargo/issues/8519
name = "devdeck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41.1", features = ["bundled"] }
chrono = { version = "0.4.45", features = ["serde"] }
anyhow = "1.0.104"
tauri-plugin-dialog = "2.8.4"
chrono-tz = "0.10.4"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2.7.0"
tauri-plugin-single-instance = "2"

# https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"
