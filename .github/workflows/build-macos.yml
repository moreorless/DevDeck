# 在 GitHub 的 macOS 机器上构建 Mac 版（Apple 芯片 + Intel 通用包），产物作为 Artifact 下载
# 触发：Actions 页面手动运行；推送 v* 标签时同时创建 GitHub Release 草稿并附上产物
name: Build macOS

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write # 推送标签时创建 Release 草稿

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      # 先在 macOS 上跑一遍 Rust 测试，确认跨平台代码正常
      - name: Rust 测试
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: 构建通用包
        run: bash scripts/release-mac.sh --universal

      - uses: actions/upload-artifact@v4
        with:
          name: DevDeck-macos-universal
          path: release/DevDeck_*_universal.*
          if-no-files-found: error

      - name: 创建 Release 草稿（仅标签触发）
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --draft --title "DevDeck $GITHUB_REF_NAME" --notes "macOS 通用包未签名，首次打开请右键 → 打开，或执行 xattr -cr /Applications/DevDeck.app"
          gh release upload "$GITHUB_REF_NAME" release/DevDeck_*_universal.* --clobber
